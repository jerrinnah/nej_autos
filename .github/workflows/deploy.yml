name: Deploy to cPanel

# Uploads the site to cPanel over FTPS on every push to main.
#
# ── The one thing that goes wrong ────────────────────────────────────────────
# FTP_SERVER must be the ORIGIN server, never the domain. nejautos.com and all
# of its subdomains (ftp., cpanel., mail.) sit behind Cloudflare, which proxies
# HTTP only — aim FTP at any of them and port 21 hangs until it times out.
# This account's origin is  host76.registrar-servers.com  (198.54.126.175).
# You can always re-derive it: cPanel → "Shared IP Address", or the ip4: values
# in the domain's SPF record.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    host76.registrar-servers.com
#   FTP_USERNAME  an FTP account whose DIRECTORY is /home/<cpanel user>/public_html
#                 (cPanel → FTP Accounts). A sub-account is confined to that
#                 directory, which is why server-dir below is "./" and not
#                 "public_html/".
#   FTP_PASSWORD  that account's password
#
# The whole repo is uploaded apart from the excludes at the bottom, so adding a
# file never means editing this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Turns the failure mode above into one actionable line instead of a
      # sixty-line ETIMEDOUT stack trace.
      - name: Preflight — can we even reach the FTP host?
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::FTP_SERVER secret is not set."
            exit 1
          fi
          echo "FTP_SERVER = $FTP_SERVER"
          getent hosts "$FTP_SERVER" || echo "(does not resolve)"
          if nc -z -w 10 "$FTP_SERVER" 21; then
            echo "OK — port 21 is open."
          else
            echo "::error::$FTP_SERVER is not reachable on port 21. If it resolves to a Cloudflare address (104.x / 172.6x / 172.7x) that is the cause: Cloudflare does not proxy FTP. Point FTP_SERVER at the origin server — for this account, host76.registrar-servers.com."
            exit 1
          fi

      # Same cache-busting as .cpanel.yml — see the comment there for why.
      - name: Stamp asset URLs
        run: |
          STAMP=$(date +%s)
          sed -i "s/?v=[A-Za-z0-9]*/?v=$STAMP/g" index.html portal.html car.html
          grep -o '?v=[0-9]*' index.html portal.html car.html

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          # Relative to the FTP ACCOUNT'S OWN HOME, not /home/<cpanel user>.
          # The deploy account is created with its directory set straight to
          # /home/<cpanel user>/public_html, so the document root IS its home
          # and the target is "./". Pointing a cPanel FTP sub-account at
          # "public_html/" instead silently uploads a whole second copy of the
          # site into <its home>/public_html, which nothing ever serves.
          server-dir: ./
          # Never overwrite server-only secrets or visitor-uploaded media.
          # admin/uploads/.htaccess is deliberately NOT excluded — the folder's
          # no-execute guard must ship.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .vercel/**
            .cpanel.yml
            .gitignore
            **/.DS_Store
            admin/config.php
            admin/uploads/cars/**
            admin/uploads/site/**
